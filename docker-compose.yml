services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: atw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: atw_timesheet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atw-network

  # ========================================
  # Backend API (NestJS)
  # ========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-production
    container_name: atw-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/atw_timesheet?schema=public
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_REGISTRATION_KEY: ${ADMIN_REGISTRATION_KEY}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./prisma:/app/prisma
      - ./scripts:/app/scripts
      - api_seed_data:/app/.seed-data
    networks:
      - atw-network
    command: sh -c "npx prisma migrate deploy && sh /app/scripts/seed-once.sh && node apps/api/dist/main.js"

  # ========================================
  # Frontend (Next.js)
  # ========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-production
    container_name: atw-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    networks:
      - atw-network

  # ========================================
  # Redis (Optional - for caching)
  # ========================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: atw-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - atw-network

# ========================================
# Networks
# ========================================
networks:
  atw-network:
    driver: bridge

# ========================================
# Volumes
# ========================================
volumes:
  postgres_data:
    driver: local
  api_seed_data:
    driver: local
  # redis_data:
  #   driver: local
